server:
  port: 8080

spring:
  main:
    web-application-type: reactive

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:

        # -------------------------
        # Identity Service (REST)
        # -------------------------
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # -------------------------
        # Chat Service (REST ONLY)
        # DO NOT route /chat/send
        # DO NOT route WebSocket
        # -------------------------
        - id: chat-service
          uri: http://localhost:8082
          predicates:
            - Path=/chat/history/**
            - Path=/chat/*

        # -------------------------
        # Messaging Service - Rooms
        # -------------------------
        - id: messaging-service-rooms
          uri: http://localhost:8083
          predicates:
            - Path=/rooms/**

        # -------------------------
        # Messaging Service - Presence (REST)
        # WebSocket STOMP bypasses gateway
        # -------------------------
        - id: messaging-service-presence
          uri: http://localhost:8083
          predicates:
            - Path=/presence/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
