server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:messagingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  websocket:
    message-size-limit: 65536        # 64 KB
    send-time-limit: 15000           # 15 seconds
    send-buffer-size-limit: 524288   # 512 KB

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
